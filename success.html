<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | CHOW HOCK CHI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 导航栏还是老样子，保持品牌统一 -->
    <header>
        <nav>
            <a href="index.html" class="logo">CHOW<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 成功提示居中排版 -->
    <main class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="reveal" style="background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 4rem 3rem; text-align: center; max-width: 600px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            
            <!-- 发光的纯CSS打勾图标，超有科技感 -->
            <div style="width: 80px; height: 80px; background: rgba(56, 189, 248, 0.1); border: 2px solid var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem auto; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <h1 style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--text-light);">Message Received!</h1>
            
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2.5rem; line-height: 1.8;">
                Thank you for reaching out. Your inquiry has been securely transmitted to my database. I will review your project details and get back to you within 24 hours.
            </p>
            
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="index.html" class="btn">Return to Home</a>
                <a href="portfolio.html" class="btn btn-outline">View My Works</a>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
